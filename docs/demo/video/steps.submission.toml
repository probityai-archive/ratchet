# The 1-minute submission video: every command runs for real against the Atlas store.
# Two outcomes, chosen by docs/demo/derive_ids.py from what Atlas holds (DEMO_OUTCOME in ids.env):
#   admitted  the main scene is an admission made by the real gates in the demo scenario (scripted agent,
#             database ratchet_demo); the refusal scene from the live-model runs follows it
#   refused   no decision is admitted; the refusal scene from the live-model runs is the main scene
# A step with `outcome` runs only in that outcome; a step with `db` reads that database.
# Tune `hold` after the first real take; check.py refuses anything over 60 s.
# {{NAME}} values are derived by docs/demo/derive_ids.py from Atlas and the stored results; none is typed.

[[step]]
id = "failure"
outcome = "admitted"
cmd = "ratchet show trace {{BAD_TRACE}}"
hold = 3.5
captions = [
  { at = 0.0, text = "Demo scenario, scripted agent. Passing tests does not show what a patch would block." },
  { at = 3.0, text = "A refund commits, then times out. The agent retries. The ledger shows two refunds." },
]

[[step]]
id = "failure_live"
outcome = "refused"
cmd = "ratchet show trace {{BAD_TRACE}}"
hold = 3.5
captions = [
  { at = 0.0, text = "Live models. Passing tests does not show what a patch would block." },
  { at = 3.0, text = "A refund call times out. The agent checks before retrying, then mails the notice to the wrong address." },
]

[[step]]
id = "matrix"
outcome = "admitted"
cmd = "ratchet replay {{REJECTED_CAND}} {{CLEARED_CAND}}"
cmd_45 = "ratchet replay {{REJECTED_CAND}} {{CLEARED_CAND}} --max-columns 2"
hold = 7.0
captions = [
  { at = 0.0, text = "Ratchet replays each proposed guard over {{REPLAY_TRACES}} recorded traces, with no model call." },
  { at = 6.0, text = "One guard stops the bad retry but also blocks a legitimate refund: rejected." },
]

[[step]]
id = "matrix_live"
outcome = "refused"
cmd = "ratchet replay {{REJECTED_CAND}} {{REFUSED_CAND}}"
cmd_45 = "ratchet replay {{REJECTED_CAND}} {{REFUSED_CAND}} --max-columns 2"
hold = 6.0
captions = [
  { at = 0.0, text = "Ratchet replays each proposed guard over {{REPLAY_TRACES}} recorded traces, with no model call." },
  { at = 4.0, text = "It shows what each guard would block. A guard that blocks a legitimate run is rejected." },
]

[[step]]
id = "admitted"
outcome = "admitted"
cmd = "ratchet show decision {{ADMITTED_CAND}}"
hold = 6.0
captions = [
  { at = 0.0, text = "Demo scenario, scripted agent. The other clears replay, then fresh held-out runs: {{STABLE_RECOVERIES}} stable recoveries (needs {{STABLE_NEEDED}}), {{PROTECTED_N}} protected cases kept." },
]

[[step]]
id = "verify"
outcome = "admitted"
cmd = "ratchet verify {{ADMITTED_CAND}}"
hold = 2.5
captions = [
  { at = 0.0, text = "The admission carries a signed receipt, checked against a pinned public key." },
]

[[step]]
id = "refusal"
cmd = "ratchet show decision {{REFUSED_CAND}}"
db = "{{REFUSED_DB}}"
hold = 9.0
captions = [
  { at = 0.0, text = "Live models: the closest candidate recovered {{REFUSED_RECOVERIES}} held-out cases in {{REFUSED_RECOVERY_RUNS}} and kept {{REFUSED_KEPT}} of {{REFUSED_PROTECTED_N}} protected ones." },
  { at = 3.0, text = "The gate refused it: {{REFUSED_WHY}}. The refusal is signed and stored." },
  { at = 5.5, text = "Run twice, the unchanged harness disagreed with itself on {{PARENT_DISCORDANT}} of {{REFUSED_HELDOUT_N}} held-out cases: it fails its own gate." },
  { at = 7.5, text = "On tau-bench retail the unchanged harness passed {{TAU_SELF_SCORES}} of the same {{TAU_SELF_TOTAL}} held-out tasks (docs/results/tau-retail.md)." },
]

[[step]]
id = "refusal_v3"
cmd = "ratchet show decision b972467a3b9a"
db = "ratchet_v3_full"
hold = 6.0
captions = [
  { at = 0.0, text = "Live gpt-oss-120b, 3,800 fresh runs: a change lifts the pass rate from 33.4% to 42.1%." },
  { at = 2.5, text = "It also drops one policy case from 21 to 8 of 40. Ratchet refuses it and signs the refusal." },
  { at = 4.5, text = "An unchanged control moved a case from 32 to 23 of 40. Without this gate, noise looks like progress." },
]

[[step]]
id = "authority"
cmd = "ratchet show decision {{AUTHORITY_DECISION}}"
db = "{{AUTHORITY_DB}}"
hold = 4.0
captions = [
  { at = 0.0, text = "Demo scenario: a change that grants the agent a tool its parent lacks fails the authority gate." },
]

[[step]]
id = "lineage"
cmd = "ratchet show lineage"
hold = 3.5
captions = [
  { at = 0.0, text = "Every version, trace and decision is kept in MongoDB Atlas, rejections included." },
]

[[step]]
id = "hooks"
cmd = "cat docs/results/hooks-replay.md"
hold = 4.0
captions = [
  { at = 0.0, text = "Real data: one guard replayed over 629,192 tool calls from 13,712 real coding-agent sessions." },
  { at = 2.0, text = "7 fires, each a push to main the guard would have stopped. 0 errors. 393 seconds." },
]

[[step]]
id = "benchmarks"
cmd = "cat {{RESULTS_FILE}}"
hold = 3.5
captions = [
  { at = 0.0, text = "Also run on AgentDojo ({{AGENTDOJO_CASES}} held-out cases) and tau-bench retail ({{TAU_CASES}} held-out tasks)." },
]

[[step]]
id = "level2"
cmd = "cat {{LEVEL2_FILE}}"
hold = 4.0
captions = [
  { at = 0.0, text = "The improver's own instructions face the same gate. On live models, search instructions admitted {{LEVEL2_SEARCH_YIELD}}, the starting ones {{LEVEL2_SEED_YIELD}}." },
  { at = 2.5, text = "Failure -> executable change -> recorded checks -> signed decision." },
]
