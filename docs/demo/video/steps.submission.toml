# The 1-minute submission video: every command runs for real against the Atlas store.
# Time plan: 0-8 failure, 8-23 replay matrix, 23-38 admission and authority,
# 38-48 verification and lineage, 48-56 benchmarks and level 2, 56-60 closing line.
# Tune `hold` after the first real take; check.py refuses anything over 60 s.
# {{NAME}} values are derived by docs/demo/derive_ids.py from Atlas and the stored results; none is typed.

[[step]]
id = "failure"
cmd = "ratchet show trace {{BAD_TRACE}}"
hold = 3.5
captions = [
  { at = 0.0, text = "Passing held-out tests is necessary. It does not show what a patch would block." },
  { at = 3.0, text = "A refund commits, then times out. The agent retries. The ledger shows two refunds." },
]

[[step]]
id = "matrix"
cmd = "ratchet replay {{REJECTED_CAND}} {{CLEARED_CAND}}"
cmd_45 = "ratchet replay {{REJECTED_CAND}} {{CLEARED_CAND}} --max-columns 2"
hold = 7.0
captions = [
  { at = 0.0, text = "Ratchet replays each proposed guard over {{REPLAY_TRACES}} recorded traces, with no model call." },
  { at = 6.0, text = "One guard stops the bad retry but also blocks a legitimate refund: rejected." },
]

[[step]]
id = "admitted"
cmd = "ratchet show decision {{ADMITTED_DECISION}}"
hold = 6.0
captions = [
  { at = 0.0, text = "The other clears replay, then fresh held-out runs: {{STABLE_RECOVERIES}} stable recoveries (needs {{STABLE_NEEDED}}), {{PROTECTED_N}} protected cases kept." },
]

[[step]]
id = "authority"
cmd = "ratchet show decision {{AUTHORITY_DECISION}}"
hold = 4.0
captions = [
  { at = 0.0, text = "A change that grows the agent's authority is rejected, whatever its score." },
]

[[step]]
id = "verify"
cmd = "ratchet verify {{ADMITTED_DECISION}}"
hold = 2.5
captions = [
  { at = 0.0, text = "Every decision carries a signed receipt, checked against a pinned public key." },
]

[[step]]
id = "lineage"
cmd = "ratchet show lineage"
hold = 3.5
captions = [
  { at = 0.0, text = "Every version, trace and decision is kept in MongoDB Atlas, rejections included." },
]

[[step]]
id = "benchmarks"
cmd = "cat {{RESULTS_FILE}}"
hold = 3.5
captions = [
  { at = 0.0, text = "Also run on AgentDojo ({{AGENTDOJO_CASES}} held-out cases) and tau-bench retail ({{TAU_CASES}} held-out tasks)." },
]

[[step]]
id = "level2"
cmd = "cat {{LEVEL2_FILE}}"
hold = 4.0
captions = [
  { at = 0.0, text = "The improver's own instructions face the same tests. Search instructions admitted {{LEVEL2_SEARCH_YIELD}}, the starting ones {{LEVEL2_SEED_YIELD}}." },
  { at = 2.5, text = "Failure -> executable change -> recorded checks -> signed admission." },
]
