[project]
name = "ratchet-harness"
version = "0.1.0"
description = "An agent harness that turns each failure into a proven guard or procedure, with every version and proof kept in MongoDB Atlas."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pymongo>=4.10",
    "httpx>=0.27",
    "cryptography>=44",
    "rich>=15.0.0",
    "raindrop-ai==0.0.75",
]

[project.scripts]
ratchet = "ratchet.cli:main"

[project.optional-dependencies]
bench = [
    "agentdojo==0.1.35",
    "litellm==1.102.1",
    "tau-bench",
]
gepa = [
    "gepa==0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "securesystemslib[crypto]>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# AgentDojo ships typed source without a py.typed marker; analyse it rather than treat it as Any.
module = ["agentdojo", "agentdojo.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error"

[tool.uv.sources]
tau-bench = { git = "https://github.com/sierra-research/tau-bench", rev = "59a200c6d575d595120f1cb70fea53cef0632f6b" }
probity-verify = { git = "https://github.com/probityai/probity-verify", rev = "b920366397cb131232163706864a70723b867367" }
